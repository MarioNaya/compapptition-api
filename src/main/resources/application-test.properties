# =============================================================================
# Perfil `test` para tests E2E con Playwright.
#
# Activar con: --spring.profiles.active=test (o SPRING_PROFILES_ACTIVE=test).
#
# Asume que `docker-compose.test.yml` está levantado:
#   - MySQL en localhost:3307 (BD compapption_e2e, user e2e_user / pass e2e_pass).
#   - Mailpit en localhost:1025 (SMTP) + 8025 (API HTTP).
# =============================================================================

# DB de tests (sobrescribe la del default).
spring.datasource.url=jdbc:mysql://localhost:3307/compapption_e2e?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=e2e_user
spring.datasource.password=e2e_pass

# El esquema se recrea de forma autoritaria al arrancar (tests siempre desde
# cero) y se llena vía API /test-only/reset entre escenarios.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Mailpit captura todo lo que se envíe; sin auth, sin TLS, sin filtros.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Frontend de tests (Playwright arranca el dev-server en :4200).
app.frontend-url=http://localhost:4200
app.cors.allowed-origins=http://localhost:4200,http://localhost:8080

# Cloudinary deshabilitado: los tests E2E no usan upload real de imágenes.
# Las cuentas vacías permiten que el contexto Spring arranque sin credenciales.
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=
cloudinary.upload-folder=compapption-e2e

# Logging mínimo para que los logs E2E no se mezclen.
logging.level.root=WARN
logging.level.com.compapption.api=INFO
logging.level.org.springframework.security=WARN

# Habilita el endpoint /test-only/* (ver TestOnlyController).
app.test-mode.enabled=true
