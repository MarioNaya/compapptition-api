# =============================================================================
# Perfil de producción — sobreescribe valores de application.properties (default)
# Activar con: --spring.profiles.active=prod (o SPRING_PROFILES_ACTIVE=prod).
# =============================================================================

# JPA / Hibernate — schema NO se modifica en runtime (S-9).
# Cualquier cambio de modelo requiere migración explícita aplicada antes del
# arranque (Flyway o SQL manual). show-sql apagado para no filtrar queries
# en logs accesibles operacionalmente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging — nivel WARN salvo en el paquete de la aplicación, donde queremos
# visibilidad de eventos de negocio (login, invitaciones, errores manejados).
# Spring Security en WARN evita filtrar detalles del flujo de autenticación.
# Cierra S-30.
logging.level.root=WARN
logging.level.com.compapption.api=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# CORS — solo el dominio de producción del frontend. La sintaxis CSV es la
# misma que en application.properties, pero sin localhost. Cierra S-22.
# Si el dominio cambia, sobreescribir vía variable de entorno
# APP_CORS_ALLOWED_ORIGINS sin tocar este fichero.
app.cors.allowed-origins=${app.frontend-url}

# Multipart — mismo límite que en dev (5 MB).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
